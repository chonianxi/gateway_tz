server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 10000
    accept-count: 100
    connection-timeout: 5000

spring:
  application:
    name: probe-service
  
  data:
    redis:
      # === 单机模式 (默认) ===
      host: localhost
      port: 6379
      password: 
      database: 0
      
      # === 集群模式 (生产环境推荐) ===
      # 启用集群模式时，注释掉上面的host/port/database，取消下面cluster的注释
      # cluster:
      #   nodes:
      #     - redis-node1:6379
      #     - redis-node2:6379
      #     - redis-node3:6379
      #     - redis-node4:6379
      #     - redis-node5:6379
      #     - redis-node6:6379
      #   max-redirects: 3
      
      # === 哨兵模式 ===
      # sentinel:
      #   master: mymaster
      #   nodes:
      #     - sentinel1:26379
      #     - sentinel2:26379
      #     - sentinel3:26379
      
      # === 通用配置 ===
      timeout: 3000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 2000ms
          time-between-eviction-runs: 30000ms
        cluster:
          refresh:
            adaptive: true
            period: 30s

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      properties:
        max.block.ms: 3000
        linger.ms: 5
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

# Jasypt加密配置 - 启动时通过环境变量或-Djasypt.encryptor.password=xxx传入主密码
jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator

probe:
  enabled: true
  token-enabled: true
  dns-config-enabled: true
  upload-enabled: true
  h5-upload-enabled: true
  
  # Kafka topic
  kafka-topic: probe_metadata
  
  # 多商户APPID和密钥配置 (支持ENC()加密)
  # 加密方式: java -cp jasypt-1.9.3.jar org.jasypt.intf.cli.JasyptPBEStringEncryptionCLI input="your-secret" password="master-password" algorithm=PBEWITHHMACSHA512ANDAES_256
  # 启动时传入主密码: -Djasypt.encryptor.password=master-password 或 环境变量 JASYPT_ENCRYPTOR_PASSWORD
  apps:
    - app-id: app001
      app-name: "商户A"
      aes-key: ENC(加密后的AES密钥)        # AES加密密钥 (支持ENC()加密)
      hmac-secret: ENC(加密后的HMAC密钥)   # HMAC签名密钥 (支持ENC()加密)
      enabled: true
    - app-id: app002
      app-name: "商户B"
      aes-key: ENC(加密后的AES密钥)
      hmac-secret: ENC(加密后的HMAC密钥)
      enabled: true
  
  # Token配置
  token-ttl-minutes: 30
  token-max-requests-per-window: 100
  token-request-window-minutes: 5
  
  # 时间戳有效期(分钟)
  timestamp-valid-minutes: 5
  
  # IP限流配置: 每个IP每3分钟最多100次
  ip-rate-limit-count: 100
  ip-rate-limit-window-seconds: 180
  
  # Nonce缓存配置
  nonce-cache-size: 100000
  nonce-cache-expire-minutes: 10
  
  # 探测域名分类配置 (支持动态刷新)
  domain-categories:
    api:
      name: "API服务"
      description: "核心API接口服务器"
      domains:
        - api.example.com
        - api-backup.example.com
    cdn:
      name: "CDN服务"
      description: "静态资源CDN节点"
      domains:
        - cdn1.example.com
        - cdn2.example.com
        - cdn3.example.com
    static:
      name: "静态资源"
      description: "静态文件服务器"
      domains:
        - static.example.com
        - img.example.com
    thirdparty:
      name: "第三方服务"
      description: "第三方依赖服务"
      domains:
        - payment.thirdparty.com
        - push.thirdparty.com
  
  # DNS服务器配置 (支持动态刷新)
  probe-dns-servers:
    - 8.8.8.8
    - 114.114.114.114
    - 223.5.5.5
  
  # 路径配置
  paths:
    ios-token-path: /api/probe/ios/token
    android-token-path: /api/probe/android/token
    ios-dns-config-path: /api/probe/ios/dns-config
    android-dns-config-path: /api/probe/android/dns-config
    ios-upload-path: /api/probe/ios/upload
    android-upload-path: /api/probe/android/upload
    h5-upload-path: /api/probe/h5/upload

management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info
  endpoint:
    refresh:
      enabled: true

logging:
  level:
    com.sports.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
